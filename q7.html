<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Fetch User Phone Number</title>
</head>
<body>
    <h2>Q7: Fetch User 3 Phone Number</h2>
    <p>Open Developer Tools (F12) -> Console to view the output.</p>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users/3")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Phone Number:", data.phone);
            })
            .catch(error => {
                console.error("Error occurred:", error.message);
            });
    </script>
</body>
</html>
