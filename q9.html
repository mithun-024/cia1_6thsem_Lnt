<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Fetch Company Information</title>
</head>
<body>
    <h2>Q9: Fetch User 4 Company Details</h2>
    <p>Open Developer Tools (F12) -> Console to view the output.</p>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users/4")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Company Name:", data.company.name);
                console.log("Website:", data.website);
            })
            .catch(error => {
                console.error("Error occurred:", error.message);
            });
    </script>
</body>
</html>
