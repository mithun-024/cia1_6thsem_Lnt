<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q10 - Handle Errors Using Fetch API</title>
</head>
<body>
    <h2>Q10: Error Handling with Fetch API (.catch)</h2>
    <p>Open Developer Tools (F12) -> Console to view the output.</p>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Data retrieved successfully:", data.name);
            })
            .catch(error => {
                console.error("Error occurred:", error.message);
            });
    </script>
</body>
</html>
