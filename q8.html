<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - Display Multiple Users</title>
</head>
<body>
    <h2>Q8: Display All User Names using forEach()</h2>
    <p>Open Developer Tools (F12) -> Console to view the output.</p>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(users => {
                console.log("List of Users:");
                users.forEach((user, index) => {
                    console.log(`${index + 1}. ${user.name}`);
                });
            })
            .catch(error => {
                console.error("Error occurred:", error.message);
            });
    </script>
</body>
</html>
